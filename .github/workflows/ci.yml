name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from the packageManager field in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Mirrors heroku-postbuild so a PR fails here before it fails on Heroku
      - name: Build common
        run: pnpm --filter common build

      - name: Generate Prisma client
        run: pnpm --filter backend prisma:generate

      - name: Typecheck common
        run: pnpm --filter common exec tsc --noEmit

      - name: Build backend
        run: pnpm --filter backend build

      - name: Test backend
        run: pnpm --filter backend test

      - name: Lint frontend
        run: pnpm --filter frontend lint

      - name: Test frontend
        run: pnpm --filter frontend test

      - name: Typecheck frontend
        # next-env.d.ts is gitignored and normally generated by next dev/build
        run: |
          printf '/// <reference types="next" />\n/// <reference types="next/image-types/global" />\n' > frontend/next-env.d.ts
          pnpm --filter frontend exec tsc --noEmit
